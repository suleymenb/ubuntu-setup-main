---
# Privacy / anti-forensics config. Every block is guarded by a toggle in
# group_vars/all.yml so you can keep any subsystem you still want.

# --- sleep -------------------------------------------------------------------
- name: Disable sleep, suspend and hibernate
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
  when: hardening_disable_sleep | default(true) | bool

# --- logging -----------------------------------------------------------------
# journald: Storage=none means nothing is written to disk or kept in memory,
# but the daemon itself keeps running. It must: journald owns /dev/log and
# every service's stdout/stderr, and with it masked, services that log can
# block on a socket nobody reads. Earlier versions masked it, so it is
# unmasked here whatever the profile says.
- name: Make sure journald is not masked
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    masked: false
    state: started

- name: Set journald storage to none
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?Storage='
    line: 'Storage=none'
    create: true
    mode: "0644"
  when: hardening_disable_logging | default(true) | bool
  register: journald_conf

- name: Restart journald so it stops storing logs
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted
  when: journald_conf is changed

# rsyslog/auditd write their own files; only touched if present.
- name: Mask rsyslog and auditd
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - rsyslog.service
    - auditd.service
  failed_when: false          # not all of these exist on every install
  when: hardening_disable_logging | default(true) | bool

- name: Vacuum existing journal entries
  ansible.builtin.command: journalctl --vacuum-time=1s
  changed_when: false
  failed_when: false
  when: hardening_disable_logging | default(true) | bool

# Truncate rather than delete: keeps ownership/permissions the services expect
# if you ever turn logging back on.
- name: Truncate known log files
  ansible.builtin.shell: |
    set -uo pipefail
    for f in /var/log/syslog /var/log/messages /var/log/auth.log \
             /var/log/kern.log /var/log/boot.log /var/log/user.log \
             /var/log/wtmp /var/log/btmp /var/log/lastlog /var/log/faillog; do
      [ -f "$f" ] && : > "$f"
    done
    exit 0
  args:
    executable: /bin/bash
  changed_when: false
  when: hardening_disable_logging | default(true) | bool

# Switching to a profile that keeps logs (server, analysis-vm) on a machine
# where an earlier run turned them off: undo exactly what the tasks above did.
# Logs that were already truncated are gone; this only restores logging from
# now on.
- name: Turn logging back on
  when: not (hardening_disable_logging | default(true) | bool)
  block:
    - name: Set journald storage back to the default
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: '^Storage=none'
        line: '#Storage=auto'
      register: journald_restored

    - name: Unmask and start the logging services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: false
        enabled: true
        state: started
      loop:
        - systemd-journald.service
        - rsyslog.service
        - auditd.service
      failed_when: false          # not all of these exist on every install

    - name: Restart journald to pick up the storage setting
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
      when: journald_restored is changed
      failed_when: false

# --- firewall ----------------------------------------------------------------
# ufw itself is installed via apps_packages; here we set the policy.
# The access role (which runs before this one) has already added the SSH and
# RDP allow rules, so "deny incoming" does not cut them off.
- name: Set ufw default policies
  community.general.ufw:
    direction: "{{ item.dir }}"
    policy: "{{ item.policy }}"
  loop:
    - { dir: incoming, policy: deny }
    - { dir: outgoing, policy: allow }
  when: hardening_firewall | default(true) | bool

# Last line of defence against locking yourself out of a remote server: if the
# access role failed or was skipped with --tags, there may be no SSH rule yet.
- name: Read the ufw rules before enabling the firewall
  ansible.builtin.command: ufw show added
  register: hardening_ufw_added
  changed_when: false
  when:
    - hardening_firewall | default(true) | bool
    - access_allow_ssh | default(true)

- name: Refuse to enable ufw while SSH is not allowed
  ansible.builtin.fail:
    msg: |
      Not enabling ufw: there is no rule allowing SSH on port {{ ssh_port }}, so
      "deny incoming" would lock you out. Run the access role first:
        sudo ansible-playbook playbook.yml --tags access
      or set access_allow_ssh: false if you never use SSH.
  when:
    - hardening_firewall | default(true) | bool
    - access_allow_ssh | default(true)
    - not (hardening_ufw_added.stdout is search('(port ' ~ ssh_port ~ ' |allow ' ~ ssh_port ~ '(/tcp)?( |$)|OpenSSH)', multiline=True))

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: hardening_firewall | default(true) | bool
