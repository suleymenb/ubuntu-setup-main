---
# Fail fast, and fail with the complete picture.
# Validates the environment and every package name up front, so you get one
# list of everything that is wrong before a single package is installed.

- name: Assert this is a Debian-family system
  ansible.builtin.assert:
    that: ansible_facts.os_family == 'Debian'
    fail_msg: >-
      This playbook targets Ubuntu/Debian only
      (detected: {{ ansible_facts.os_family }} / {{ ansible_facts.distribution }}).
    quiet: true

- name: Assert we are running as root
  ansible.builtin.assert:
    that: ansible_facts.effective_user_id == 0
    fail_msg: >-
      This playbook needs root. Run it as:
      sudo ansible-playbook playbook.yml
    quiet: true

# --- login user --------------------------------------------------------------
# The real user behind "sudo ansible-playbook". Several roles write into their
# home directory, which is NOT always /home/<name> (LDAP, custom homes), so it
# is read from the passwd database once, here, and reused everywhere.
- name: Identify the login user
  ansible.builtin.set_fact:
    login_user: "{{ ansible_facts.env.SUDO_USER | default('') }}"

- name: Look up the login user's account
  ansible.builtin.getent:
    database: passwd
    key: "{{ login_user }}"
  when: login_user not in ['', 'root']

- name: Record the login user's home directory and primary group
  ansible.builtin.set_fact:
    # passwd fields after the name: password, uid, gid, gecos, home, shell
    login_home: "{{ ansible_facts.getent_passwd[login_user][4] }}"
    login_gid: "{{ ansible_facts.getent_passwd[login_user][2] }}"
  when: login_user not in ['', 'root']

- name: Measure free disk space on /
  ansible.builtin.command: df -BG --output=avail /
  register: df_root
  changed_when: false

- name: Assert there is enough free disk space
  ansible.builtin.assert:
    that: (df_root.stdout_lines[1] | trim | regex_replace('G$', '') | int) >= (preflight_min_free_gb | int)
    fail_msg: >-
      Only {{ df_root.stdout_lines[1] | trim }} free on / —
      at least {{ preflight_min_free_gb }}G is needed for a desktop install.
    quiet: true

# The mirrors to check are read from apt's own sources, not hardcoded: cloud
# images use their provider's mirror (e.g. azure.archive.ubuntu.com), arm64
# uses ports.ubuntu.com, and some hosts only allow https. preflight_hosts in
# group_vars overrides the detection.
- name: Find the apt mirrors this host uses
  ansible.builtin.shell: |
    set -uo pipefail
    {
      grep -hE '^[[:space:]]*deb(-src)?[[:space:]]' \
        /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null \
        | sed -E 's/\[[^]]*\]//' | awk '{print $2}' || true
      grep -hE '^[[:space:]]*URIs:' /etc/apt/sources.list.d/*.sources 2>/dev/null \
        | sed -E 's/^[[:space:]]*URIs:[[:space:]]*//' | tr ' ' '\n' || true
    } | { grep -E '^https?://' || true; } \
      | sed -E 's#^(https?)://([^/:]+)(:([0-9]+))?.*#\1 \2 \4#' \
      | awk '{ p = $3; if (p == "") p = ($1 == "https" ? 443 : 80); print $2 ":" p }' \
      | sort -u
  args:
    executable: /bin/bash
  register: preflight_apt_mirrors
  changed_when: false
  when: (preflight_hosts | default([])) | length == 0

- name: Check that the apt mirrors are reachable
  ansible.builtin.wait_for:
    host: "{{ item.split(':')[0] }}"
    port: "{{ item.split(':')[1] | default(80) | int }}"
    timeout: 8
  loop: >-
    {{ preflight_hosts if (preflight_hosts | default([])) | length > 0
       else preflight_apt_mirrors.stdout_lines | default([]) }}
  register: net_check
  failed_when: false

- name: Report unreachable mirrors
  ansible.builtin.fail:
    msg: |
      Cannot reach these apt mirrors — check your network, proxy or DNS:
      {{ net_check.results | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='item') | list | join(', ') }}
  when: net_check.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0

# Mirrors and Launchpad PPAs return the odd 5xx. Without retries one hiccup
# fails a whole role (and everything that needed its packages).
- name: Let apt retry failed downloads
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80-ubuntu-setup-retries
    content: "Acquire::Retries \"5\";\n"
    owner: root
    group: root
    mode: "0644"

- name: Update the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# PPAs have to exist before their packages can be validated at all — veracrypt
# is not in the Ubuntu repos, so without this it would look like a typo.
#
# Deliberately add-apt-repository rather than the apt_repository module: that
# module fetches the signing key over the legacy gpg keyserver protocol
# (hkp://keyserver.ubuntu.com:80), which fails with "Unable to get required
# signing key / nothing exported" on hosts where port 80 to the keyserver is
# blocked or the keyserver is having a bad day. add-apt-repository uses the
# Launchpad API over HTTPS and writes a deb822 .sources file with Signed-By.
- name: Ensure add-apt-repository is available
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  when: (apps_ppas | default([])) | length > 0

- name: Check which PPAs are already configured
  ansible.builtin.shell: |
    set -o pipefail
    if grep -rqs "{{ item | regex_replace('^ppa:', '') }}" \
         /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
      echo PRESENT
    else
      echo ABSENT
    fi
  args:
    executable: /bin/bash
  loop: "{{ apps_ppas | default([]) }}"
  register: ppa_present
  changed_when: false

- name: Add the missing PPAs
  ansible.builtin.command: "add-apt-repository -y {{ item.item }}"
  loop: "{{ ppa_present.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'ABSENT' in (item.stdout | default(''))"
  changed_when: true          # only runs for PPAs that are missing
  register: ppa_added

- name: Update the apt cache after adding PPAs
  ansible.builtin.apt:
    update_cache: true
  when: ppa_added is changed

# Catching a typo here costs seconds. Catching it during the install costs a
# partially configured desktop. One task with a shell loop rather than one
# Ansible loop item per package: same check, a fraction of the time.
- name: Validate every package name exists
  # argv form: package names are passed as arguments, never pasted into a
  # shell string. The loop prints each name apt-cache cannot find.
  ansible.builtin.command:
    argv: >-
      {{ ['/bin/bash', '-c', 'for p in "$@"; do apt-cache show "$p" >/dev/null 2>&1 || echo "$p"; done', 'check']
         + desktop_packages + xrdp_packages + (apps_packages | default([]))
         + (virt_packages | default([])) }}
  register: pkg_check
  changed_when: false

- name: Report every package name that does not exist
  ansible.builtin.fail:
    msg: |
      These packages are not available from the configured apt sources:
        {{ pkg_check.stdout_lines | join('\n  ') }}
      Nothing has been installed. Fix the names in group_vars/all.yml.
  when: pkg_check.stdout_lines | length > 0

- name: Check which optional packages this release has
  ansible.builtin.command: "apt-cache show {{ item }}"
  loop: "{{ apps_optional_packages | default([]) }}"
  register: optional_pkg_check
  changed_when: false
  failed_when: false

- name: Remember the optional packages that can be installed
  ansible.builtin.set_fact:
    apps_optional_available: >-
      {{ optional_pkg_check.results | default([]) | selectattr('rc', 'eq', 0)
         | map(attribute='item') | list }}

- name: Warn about optional packages this release does not have
  ansible.builtin.debug:
    msg: >-
      Not available on {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }},
      skipped: {{ optional_pkg_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}
  when: optional_pkg_check.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0

# Snaps come from a different store than apt, so apt-cache cannot vouch for
# them. Check snapd is usable and that each name actually exists, otherwise a
# typo only surfaces halfway through the apps role.
- name: Check that snapd is available
  ansible.builtin.command: snap version
  register: snap_version
  changed_when: false
  failed_when: false
  when: (apps_snaps | default([])) | length > 0

- name: Report missing snapd
  ansible.builtin.fail:
    msg: |
      snapd is not available but {{ (apps_snaps | default([])) | length }} snap(s)
      are configured. Install it first:  apt install snapd
  when:
    - (apps_snaps | default([])) | length > 0
    - snap_version.rc | default(0) != 0

- name: Validate every snap name exists
  ansible.builtin.command: "snap info {{ item.name }}"
  loop: "{{ apps_snaps | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: snap_check
  changed_when: false
  failed_when: false
  when: snap_version.rc | default(1) == 0

- name: Report every snap name that does not exist
  ansible.builtin.fail:
    msg: |
      These snaps do not exist in the store:
        {{ snap_check.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
           | map(attribute='item.name') | list | join('\n  ') }}
      Nothing has been installed. Fix the names in group_vars/all.yml.
  when:
    - snap_check.results is defined
    - snap_check.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0

# --- remote access -----------------------------------------------------------
# A typo in an IP here becomes a firewall rule for the wrong address, which is
# a lockout. Shape check only; ufw rejects anything it cannot parse.
- name: Validate the allowed source addresses
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$') or
        item is match('^[0-9a-fA-F:]*:[0-9a-fA-F:]*(/[0-9]{1,3})?$')
    fail_msg: >-
      "{{ item }}" in access_allowed_from is not an IP address or CIDR range
      (e.g. 203.0.113.7 or 198.51.100.0/24).
    quiet: true
  loop: "{{ access_allowed_from | default([]) }}"

- name: Find the login user's authorized SSH keys
  ansible.builtin.stat:
    path: "{{ login_home }}/.ssh/authorized_keys"
  register: preflight_authorized_keys
  when:
    - ssh_key_only | default(false)
    - login_home is defined

# Turning off passwords with no key in place is the one setting here that
# locks you out for certain.
- name: Refuse key-only SSH without an authorized key
  ansible.builtin.fail:
    msg: |
      ssh_key_only is on, but {{ login_home | default('~<user>') }}/.ssh/authorized_keys
      is missing or empty — turning off passwords now would lock you out.
      From the machine you connect FROM, run:
        ssh-copy-id {{ login_user | default('<user>', true) }}@<this-server>
      check that "ssh <user>@<this-server>" logs in without a password, then run again.
  when:
    - ssh_key_only | default(false)
    - login_home is not defined
      or not preflight_authorized_keys.stat.exists
      or preflight_authorized_keys.stat.size == 0

# --- profile and combinations ------------------------------------------------
- name: Validate the profile
  ansible.builtin.assert:
    that: setup_profile in ['workstation', 'server', 'analysis-vm']
    fail_msg: >-
      setup_profile is "{{ setup_profile }}" — use workstation, server or
      analysis-vm.
    quiet: true

- name: Refuse fail2ban without logs
  ansible.builtin.fail:
    msg: |
      fail2ban_enabled and hardening_disable_logging are both on. fail2ban
      works by reading the logs that hardening switches off, so it would
      silently never ban anything. Turn one of them off.
  when:
    - fail2ban_enabled | bool
    - hardening_disable_logging | bool

- name: Check that your RDP certificate and key exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [xrdp_tls_cert, xrdp_tls_key | default('')] | select | list }}"
  register: preflight_tls_files
  when: (xrdp_tls_cert | default('')) | length > 0

- name: Report a missing RDP certificate or key
  ansible.builtin.fail:
    msg: |
      xrdp_tls_cert / xrdp_tls_key must both point to files on this server.
      Not found: {{ preflight_tls_files.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}
  when:
    - (xrdp_tls_cert | default('')) | length > 0
    - (xrdp_tls_key | default('')) | length == 0
      or preflight_tls_files.results | rejectattr('stat.exists') | list | length > 0

- name: Preflight passed
  ansible.builtin.debug:
    msg: >-
      Preflight OK — {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }},
      root, disk, mirrors, {{ (apps_ppas | default([])) | length }} PPA(s),
      {{ (desktop_packages + xrdp_packages + (apps_packages | default([]))
          + (virt_packages | default([]))) | length }} package(s) and
      {{ (apps_snaps | default([])) | length }} snap(s) all validated.
