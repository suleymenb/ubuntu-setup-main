---
# Package names live in group_vars/all.yml.

- name: Install xrdp
  ansible.builtin.apt:
    name: "{{ xrdp_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# xrdp reads /etc/ssl/private/ssl-cert-snakeoil.key, which is only readable by
# the ssl-cert group. Without this you get TLS errors the moment a client
# connects — the package does not do it for you.
- name: Allow xrdp to read the TLS certificate
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: true
  when: xrdp_add_to_ssl_cert_group | default(true)
  notify: Restart xrdp

# xrdp starts whatever ~/.xsession says. With nothing there you authenticate
# fine and land on an empty grey screen — by far the most common reason people
# think xrdp is broken. This is written for the real login user, not root.
- name: Set the RDP session command for the login user
  ansible.builtin.copy:
    content: "{{ xrdp_session_command }}\n"
    dest: "{{ login_home }}/.xsession"
    owner: "{{ login_user }}"
    group: "{{ login_gid }}"
    mode: "0644"
  when: login_home is defined

- name: Note that no .xsession was written
  ansible.builtin.debug:
    msg: >-
      Could not determine a non-root login user, so ~/.xsession was not written.
      Do it by hand or RDP will show a grey screen:
      echo "{{ xrdp_session_command }}" > ~/.xsession
  when: login_home is not defined

# --- TLS certificate ---------------------------------------------------------
# By default xrdp uses Ubuntu's self-signed "snakeoil" certificate, so every
# client warns about it, and you cannot tell a real warning from that one.
# With your own certificate the warning goes away and a new one means
# something. The files are COPIED into /etc/xrdp: xrdp reads them as the
# unprivileged xrdp user, which cannot get into /etc/letsencrypt/live. Re-run
# --tags xrdp after renewing.
- name: Copy your TLS certificate and key for xrdp
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    owner: root
    group: ssl-cert
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ xrdp_tls_cert }}", dest: /etc/xrdp/ubuntu-setup-cert.pem, mode: "0644" }
    - { src: "{{ xrdp_tls_key }}", dest: /etc/xrdp/ubuntu-setup-key.pem, mode: "0640" }
  loop_control:
    label: "{{ item.dest }}"
  when: (xrdp_tls_cert | default('')) | length > 0
  notify: Restart xrdp

# Empty values mean "the default" (Ubuntu's snakeoil pair), which is how
# taking xrdp_tls_cert out again restores the old behaviour.
- name: Point xrdp at the certificate
  community.general.ini_file:
    path: /etc/xrdp/xrdp.ini
    section: Globals
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - option: certificate
      value: "{{ '/etc/xrdp/ubuntu-setup-cert.pem' if (xrdp_tls_cert | default('')) | length > 0 else '' }}"
    - option: key_file
      value: "{{ '/etc/xrdp/ubuntu-setup-key.pem' if (xrdp_tls_cert | default('')) | length > 0 else '' }}"
  loop_control:
    label: "{{ item.option }}={{ item.value }}"
  notify: Restart xrdp

- name: Enable and start xrdp
  ansible.builtin.systemd_service:
    name: xrdp
    enabled: true
    state: started
    daemon_reload: true

# --- firewall ----------------------------------------------------------------
# The RDP port is opened by the access role, together with SSH, so both follow
# the same access_allowed_from list. It runs right after this role.

# --- verify ------------------------------------------------------------------

- name: Check that xrdp is listening
  ansible.builtin.wait_for:
    port: "{{ xrdp_port }}"
    host: 127.0.0.1
    timeout: 15
  register: xrdp_listening
  failed_when: false

- name: Fail if xrdp is not listening
  ansible.builtin.fail:
    msg: |
      xrdp is installed but nothing is listening on port {{ xrdp_port }}.
      Check the service:
        systemctl status xrdp
        journalctl -u xrdp -n 50
  when: xrdp_listening is failed

- name: Show how to connect
  ansible.builtin.debug:
    msg: >-
      xrdp is listening on port {{ xrdp_port }}. Connect with any RDP client to
      {{ ansible_facts.default_ipv4.address | default('this host') }}:{{ xrdp_port }}
      and log in with your normal Linux username and password.
