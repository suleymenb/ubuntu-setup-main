---
# Single source of truth for everything this playbook manages.
# The preflight role validates these before anything is installed, and
# verify.sh reads the same file, so they cannot drift apart.

# --- profile -----------------------------------------------------------------
# What kind of machine this is. It sets the defaults further down (look for
# setup_profile); each one can still be overridden on its own.
#
#   workstation   your own box: logging off (anti-forensics), no fail2ban,
#                 automatic security updates
#   server        reachable from the internet: logging on, fail2ban on SSH and
#                 RDP, automatic security updates
#   analysis-vm   for studying samples: logging ON so you keep the trail,
#                 no fail2ban, NO automatic updates (the VM must not change
#                 underneath an analysis — take snapshots, update by hand)
#
# bootstrap.sh asks for this and saves it to local.yml.
setup_profile: workstation

# --- preflight ---------------------------------------------------------------
# LXDE + CLion snap + JDK + QEMU + toolchains need roughly 8-10 GB together,
# so less than this will most likely run out partway through.
preflight_min_free_gb: 10
# Empty = check the mirrors apt is actually configured with. Set entries as
# "host" (port 80) or "host:port" to check something else instead.
preflight_hosts: []

# --- desktop -----------------------------------------------------------------

desktop_packages:
  - lxde
desktop_systemd_target: graphical.target

# --- apps --------------------------------------------------------------------
apps_ppas:
  - ppa:unit193/encryption

apps_packages:
  - vlc
  - veracrypt
  # C toolchain + cross-compiling / offensive-security tooling
  - build-essential    # includes gcc, g++, make, libc-dev
  - gdb
  - clang
  - git
  - mingw-w64          # cross-compile Windows PE binaries from Linux
  - nasm               # x86 assembler
  - default-jdk        # includes the JRE
  - proxychains4       # note: package is proxychains4, binary is proxychains
  - socat
  - p7zip-full
  - gnupg
  - curl
  - wget
  - dirmngr
  - software-properties-common
  - lsb-release
  - ca-certificates
  - libfuse-dev
  - dmsetup
  - python3-shodan     # shodan CLI
  - ufw
  - colorize
  - guake
  - tmux
  - zsh
  - gedit
  - keepass2           # password manager

# Installed when the release has them, skipped with a warning when it does
# not — instead of failing preflight. eza (modern ls) is only in the Ubuntu
# repos from 24.04 on.
apps_optional_packages:
  - eza

# Snap packages. classic: true maps to --classic, which IDEs need because they
# require access outside the snap sandbox.
#
# CLion lives here and NOT in jetbrains_ides below: the snap is the build
# JetBrains publish themselves and it auto-updates. Listing it in both places
# installed two separate copies of the same IDE.
apps_snaps:
  - name: clion
    classic: true

# Packages with no apt source at all, installed from a GitHub release .deb.
# The version is resolved from the API at run time, so this never goes stale.
apps_github_debs:
  - name: obsidian
    repo: obsidianmd/obsidian-releases
    asset_match: 'amd64\.deb'
    architectures: [amd64]
    # No .deb for other architectures; use the AppImage there.
    appimage_match:
      arm64: 'arm64\.AppImage$'

# --- virtualisation ----------------------------------------------------------
# Own role and own tag: this is a different concern from installing apps, and
# it needs group membership and a running daemon, not just packages.
virt_packages:
  - qemu-system-x86
  - libvirt-daemon-system
  - libvirt-clients
  - bridge-utils
  - virt-manager
  - cpu-checker          # provides kvm-ok

# Without these virt-manager sees no hypervisor and every VM action asks for
# a password. Only applies to new logins.
virt_user_groups:
  - libvirt
  - kvm

# --- jetbrains ---------------------------------------------------------------
# Installed from jetbrains-ppa, an UNOFFICIAL third-party apt repo
# (https://github.com/JonasGroeger/jetbrains-ppa) — not run by JetBrains, and it
# can lag behind upstream releases. Prefer a snap in apps_snaps where one exists.
#
# CLion is deliberately not listed here — it comes from the snap above. Adding it
# back would install a second copy alongside it.
#
# Empty list = the whole jetbrains role no-ops (repo is never even added).
# Each IDE is 1-2 GB, so only uncomment what you actually use.
jetbrains_ides: []
# - rustrover
# - intellij-idea-ultimate
# - pycharm-professional

# --- shodan ------------------------------------------------------------------
# API key is a SECRET — never commit it. Set it at run time instead:
#   sudo ansible-playbook playbook.yml -e shodan_api_key=YOUR_KEY
# or export SHODAN_API_KEY and the role picks it up. Empty = skip shodan init.
shodan_api_key: "{{ lookup('env', 'SHODAN_API_KEY') | default('', true) }}"

# --- zsh ---------------------------------------------------------------------
# Oh My Zsh + plugins, configured for the login user (not root).
zsh_plugins:
  - git
  - eza
  - sudo
  - colorize
  - tmux
  - zsh-autosuggestions
  - zsh-syntax-highlighting
# Pinned versions, so a run installs exactly what was tested rather than
# whatever is on master today. Bump on purpose.
# Oh My Zsh has no release tags; this is a commit on master (2026-11).
zsh_ohmyzsh_version: 93b87c9c9aaae2f56b41a1f7fdf64fc1d603a9b7
zsh_custom_plugins:
  - name: zsh-autosuggestions
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    version: v0.7.1
  - name: zsh-syntax-highlighting
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: "0.8.0"
# Set zsh as the login shell for the login user. On by default — set to false
# to keep your current shell.
zsh_make_default_shell: true
# Start tmux automatically in every interactive zsh (local terminals, SSH).
zsh_tmux_autostart: true

# --- remote access -----------------------------------------------------------
# Who may reach SSH and RDP, and how SSH logins work. bootstrap.sh asks these
# questions on the first run and saves your answers to local.yml (not
# committed), which overrides the defaults below.
#
# Firewall sources for SSH and RDP. Empty = anyone. Each entry is an IP or a
# CIDR range, e.g. "203.0.113.7" or "198.51.100.0/24".
access_allowed_from: []

# Allow SSH through ufw. The hardening role switches on "deny incoming" and
# refuses to do so while no SSH rule exists, so this keeps you from locking
# yourself out of a remote server.
access_allow_ssh: true
ssh_port: 22

# Turn off SSH password login, keys only. Preflight refuses to apply it while
# the login user has no ~/.ssh/authorized_keys, so you cannot lock yourself out.
ssh_key_only: false
# Block SSH logins as root (with or without a key).
ssh_disable_root_login: false

# --- automatic updates -------------------------------------------------------
# unattended-upgrades installs security updates daily. Off on analysis-vm.
updates_enabled: "{{ setup_profile != 'analysis-vm' }}"
# Reboot by itself when an update needs it (kernel, libc). Off by default: a
# surprise reboot drops your RDP session. Without it, check for
# /var/run/reboot-required now and then.
updates_auto_reboot: false
updates_reboot_time: "04:00"

# --- fail2ban ----------------------------------------------------------------
# Bans an address after repeated failed SSH or RDP logins. On by default only
# for the server profile. Needs logging, so it cannot be combined with
# hardening_disable_logging. Addresses in access_allowed_from are never banned.
fail2ban_enabled: "{{ setup_profile == 'server' }}"
fail2ban_maxretry: 5
fail2ban_findtime: 10m
fail2ban_bantime: 1h

# --- dotfiles ----------------------------------------------------------------
# Your own config files from a git repo, cloned to ~/.dotfiles and linked into
# your home. Empty = skipped. Use an https URL for a public repo; a private one
# needs an SSH key on this server that GitHub accepts.
dotfiles_repo: ""
dotfiles_version: HEAD
dotfiles_dest: .dotfiles
# Home-relative link -> file in the repo. Existing files are moved aside to
# <name>.before-dotfiles once, never deleted. Example:
#   dotfiles_links:
#     .tmux.conf: tmux/tmux.conf
#     .gitconfig: git/gitconfig
dotfiles_links: {}
# Or let the repo install itself, run from inside the clone (only after a
# change), e.g. "./install.sh".
dotfiles_install_command: ""

# --- hardening ---------------------------------------------------------------
# Privacy / anti-forensics config from the old script.
hardening_disable_sleep: true       # mask sleep/suspend/hibernate targets
# journald stores nothing, rsyslog/auditd off, logs truncated. Only on the workstation
# profile: an analysis VM keeps the trail of what a sample did, and a server
# needs logs for fail2ban. Setting it to false later turns logging back on.
hardening_disable_logging: "{{ setup_profile == 'workstation' }}"
hardening_firewall: true            # ufw: deny incoming, allow outgoing

# --- xrdp --------------------------------------------------------------------
xrdp_packages:
  - xrdp
xrdp_port: 3389
xrdp_session_command: "startlxde"
xrdp_add_to_ssl_cert_group: true
xrdp_configure_firewall: true
# Your own TLS certificate for RDP instead of Ubuntu's self-signed one (which
# makes every client warn). Paths ON THE SERVER, e.g. from certbot:
#   xrdp_tls_cert: /etc/letsencrypt/live/rdp.example.com/fullchain.pem
#   xrdp_tls_key:  /etc/letsencrypt/live/rdp.example.com/privkey.pem
# Empty = the default certificate. Re-run --tags xrdp after renewing.
xrdp_tls_cert: ""
xrdp_tls_key: ""

# --- reboot ------------------------------------------------------------------
ubuntu_auto_reboot: false
