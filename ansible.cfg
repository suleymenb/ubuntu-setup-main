[defaults]
inventory = inventory.ini
interpreter_python = auto_silent
nocows = 1
retry_files_enabled = False
# bootstrap.sh installs the pinned collections into ./collections, so the
# versions in requirements.yml are the ones used, also under sudo.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
callback_result_format = yaml

# Top-level facts (ansible_env, ansible_system, ...) are deprecated and will
# stop being injected in ansible-core 2.24. Every task here already uses the
# ansible_facts.* form, so we opt out now.
inject_facts_as_vars = False

[privilege_escalation]
become = True
become_method = sudo
